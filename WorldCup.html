    .swipe-panel { width: 50%; flex-shrink: 0; scroll-snap-align: start; }

    .match-status.upcoming { background: rgba(64,128,255,0.15); color: #4080ff; }

function cnName(en) {
  if (EN_TO_CN[en]) return EN_TO_CN[en];
  // 淘汰赛阶段 ESPN 占位符翻译
  let m = en.match(/^Group ([A-Z]) Winner$/i);
  if (m) return m[1] + '组第一';
  m = en.match(/^Group ([A-Z]) 2nd Place$/i);
  if (m) return m[1] + '组第二';
  m = en.match(/^Third Place Group (.+)$/i);
  if (m) return m[1] + '组第三';
  m = en.match(/^Round of (\d+) (\d+) (Winner|2nd Place)$/i);
  if (m) {
    const roundN = parseInt(m[1]), matchN = m[2], type = m[3].toLowerCase();
    const suffix = type === 'winner' ? '胜者' : '第二';
    let label;
    if (roundN <= 2) label = '决赛';
    else if (roundN <= 4) label = '半决赛';
    else label = '1/' + (roundN / 2) + '决赛';
    return label + '第' + matchN + '场' + suffix;
  }
  m = en.match(/^(Quarterfinal|Semifinal) (\d+) (Winner|Loser)$/i);
  if (m) {
    const label = m[1].toLowerCase() === 'quarterfinal' ? '1/4决赛' : '半决赛';
    const suffix = m[3].toLowerCase() === 'winner' ? '胜者' : '负者';
    return label + '第' + m[2] + '场' + suffix;
  }
  for (const key in EN_TO_CN) {
    if (en.includes(key) || key.includes(en)) return EN_TO_CN[key];
  }
  return en;
}

// FIFA 世界排名 (2026年6月)
const RANKINGS = {
  '阿根廷':1,'西班牙':2,'法国':3,'英格兰':4,'葡萄牙':5,'巴西':6,'摩洛哥':7,'荷兰':8,

  '厄瓜多尔':23,'奥地利':24,'韩国':25,'尼日利亚':26,'澳大利亚':27,'阿尔及利亚':28,
  '埃及':29,'加拿大':30,'挪威':31,'乌克兰':32,'科特迪瓦':33,'巴拿马':34,'俄罗斯':35,

};

/*
 * AI 赛前预测核心函数。
 * 输入主客队名、已完赛数据、小组名，返回 { pick, prediction, reason }。
 *
 * 预测流程：
 *   1. 基础排名 → 有效排名（ehr / ear，值越小越强）
 *   2. 本届战绩修正（连胜/连败加权）、历史交锋修正、出线形势修正
 *   3. 近期状态作为因子补充（优先 dynamicRecent，fallback 到静态 RECENT）
 *   4. 按有效排名差值（diff = |ehr - ear|）分档生成比分和胜负判断
 *   5. 过滤与预测矛盾的因子（如交锋占优方 ≠ 预测胜方）
 *   6. 组装理由文本：排名信息 + 最多 2 条因子 + 综合判断结语
 *
 * 有效排名修正规则（负数=增强实力）：
 *   单场胜 -8，平 -2，负 +5；连胜 ≥2 追加 -(n×3)，连败 ≥2 追加 +(n×3)
 *   历史交锋占优方 -5，劣势方 +3；小组 0 分 -8，1 分 -4
 */
function predictMatch(homeName, awayName, settledMatches, league) {
  const hr = RANKINGS[homeName] || 99;
  const ar = RANKINGS[awayName] || 99;

  // 有效排名 = 基础排名 + 修正（负数=增强）
  let ehr = hr, ear = ar;
  let factors = [];

  /*
   * 1. 本届多轮战绩修正。
   *    从 settledMatches 中遍历每队的比赛结果，记录 W/D/L 序列。
   *    单场修正：胜 -8，平 -2，负 +5（值越小越强）。
   *    连续修正：连胜/连败 ≥2 时，额外加权 ±(n×3)（见下方 streakVal）。
   *    汇总结果通过 teamLabel 生成中文描述因子（如"德国2连胜势头正盛"）。
   */
  if (settledMatches) {
    let homeRes = [], awayRes = [];
    // 按时间升序排列，确保 results 数组尾部为最近比赛，streakVal/teamLabel 分析正确方向
    const sortedMatches = [...settledMatches].sort((a, b) => (a.matchTs || 0) - (b.matchTs || 0));
    for (const m of sortedMatches) {
      if (m.homeName === homeName) {
        const [hs, as] = m.score.split(':').map(Number);
        homeRes.push(hs > as ? 'W' : (hs === as ? 'D' : 'L'));
        if (hs > as) ehr -= 8; else if (hs === as) ehr -= 2; else ehr += 5;
      }
      if (m.awayName === homeName) {
        const [hs, as] = m.score.split(':').map(Number);
        homeRes.push(as > hs ? 'W' : (as === hs ? 'D' : 'L'));
        if (as > hs) ehr -= 8; else if (as === hs) ehr -= 2; else ehr += 5;
      }
      if (m.homeName === awayName) {
        const [hs, as] = m.score.split(':').map(Number);
        awayRes.push(hs > as ? 'W' : (hs === as ? 'D' : 'L'));
        if (hs > as) ear -= 8; else if (hs === as) ear -= 2; else ear += 5;
      }
      if (m.awayName === awayName) {
        const [hs, as] = m.score.split(':').map(Number);
        awayRes.push(as > hs ? 'W' : (as === hs ? 'D' : 'L'));
        if (as > hs) ear -= 8; else if (as === hs) ear -= 2; else ear += 5;
      }
    }

    // 汇总一队描述
    function teamLabel(results, name) {
      if (results.length === 0) return null;
      const last = results[results.length - 1];
      let n = 1;
      for (let i = results.length - 2; i >= 0; i--) {
        if (results[i] === last) n++; else break;
      }
      if (n >= 2) {
        if (last === 'W') return name + n + '连胜势头正盛';
        if (last === 'L') return name + n + '连败状态低迷';
      }
      var cnts = results.reduce(function(a, r) { a[r] = (a[r]||0) + 1; return a; }, {});
      var w = cnts.W || 0, d = cnts.D || 0, l = cnts.L || 0;
      if (l === 0 && d === 0 && w >= 3) return name + w + '场全胜气势如虹';
      if (w === 0 && d === 0) return name + l + '场全败急需反弹';
      let label = name;
      if (w > 0) label += w + '胜';
      if (d > 0) label += d + '平';
      if (l > 0) label += l + '负';
      return label;
    }

    function streakVal(results) {
      if (results.length < 2) return 0;
      const last = results[results.length - 1];
      let n = 1;
      for (let i = results.length - 2; i >= 0; i--) {
        if (results[i] === last) n++; else break;
      }
      if (n >= 2 && last === 'W') return -(n * 3);
      if (n >= 2 && last === 'L') return n * 3;
      return 0;
    }
    ehr += streakVal(homeRes);
    ear += streakVal(awayRes);

    const hLabel = teamLabel(homeRes, homeName);
    const aLabel = teamLabel(awayRes, awayName);
    if (hLabel) factors.push(hLabel);
    if (aLabel) factors.push(aLabel);
  }

  /*
   * 2. 历史交锋修正 —— 从 H2H 字典解析交锋记录，给占优方/劣势方调整有效排名。
   *    占优因子（h2hFactor）不立即 push 到 factors，而是延后到战绩因子之后，
   *    确保理由展示时"交锋占优"不会挤掉更重要的战绩/状态因子。
   */
  var h2hFactor = null;
  const h2h = H2H[homeName + '|' + awayName];
  if (h2h && !h2h.includes('首次')) {
    // 队名可能包含正则元字符，转义后再拼入 RegExp
    const escH = homeName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const escA = awayName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const homeWins = (h2h.match(new RegExp(escH + '(\\d+)胜')) || [])[1];
    const awayWins = (h2h.match(new RegExp(escA + '(\\d+)胜')) || [])[1];
    if (homeWins || awayWins) {
      const hw = parseInt(homeWins) || 0, aw = parseInt(awayWins) || 0;
      if (hw > aw) { ehr -= 5; ear += 3; h2hFactor = homeName + '占优'; }
      else if (aw > hw) { ear -= 5; ehr += 3; h2hFactor = awayName + '占优'; }
    } else if (h2h.includes(homeName + '全胜') || h2h.includes(homeName + '占优')) {
      ehr -= 5; ear += 3; h2hFactor = homeName + '占优';
    } else if (h2h.includes(awayName + '全胜') || h2h.includes(awayName + '占优')) {
      ear -= 5; ehr += 3; h2hFactor = awayName + '占优';
    }
  }

  // 3. 出线形势修正
  if (league && groupStandings) {
    const groupKey = league.replace('组', '');
    const group = groupStandings[groupKey];
    if (group && group.length >= 4) {
      const homeRow = group.find(function(r) { return r.team === homeName; });
      const awayRow = group.find(function(r) { return r.team === awayName; });
      if (homeRow && homeRow.gp >= 1 && homeRow.pts === 0) { ehr -= 8; factors.push(homeName + '急需3分'); }
      else if (homeRow && homeRow.gp >= 1 && homeRow.pts === 1) { ehr -= 4; factors.push(homeName + '需取胜'); }
      if (awayRow && awayRow.gp >= 1 && awayRow.pts === 0) { ear -= 8; factors.push(awayName + '急需3分'); }
      else if (awayRow && awayRow.gp >= 1 && awayRow.pts === 1) { ear -= 4; factors.push(awayName + '需取胜'); }
    }
  }

  // 4. 近期状态补充（无本届战绩时用静态 RECENT）
  function recentFactor(name) {
    var r = dynamicRecent[name] || RECENT[name];
    if (!r) return null;
    var brief = r.split('，')[0].replace(/（[^）]*）/g, '');
    // 去掉冗余前缀，精简为关键数字
    brief = brief.replace(/^近\d+场/, '').replace(/^各项赛事/, '').replace(/^热身赛/, '').replace(/^世预赛/, '').replace(/^预选赛/, '');
    // "六连胜+5场零封" → "六连胜"
    brief = brief.replace(/\+.*$/, '');
    if (!brief) return null;
    return name + brief;
  }
  var hRec = recentFactor(homeName);
  var aRec = recentFactor(awayName);
  if (factors.length < 2) {
    if (h2hFactor) {
      // 有交锋占优时只补占优方战绩，避免占优因子被挤出前2
      var domRec = h2hFactor.indexOf(homeName) === 0 ? hRec : aRec;
      if (domRec) factors.push(domRec);
    } else {
      if (hRec && !factors.some(function(f) { return f.indexOf(homeName) === 0; })) factors.push(hRec);
      if (aRec && !factors.some(function(f) { return f.indexOf(awayName) === 0; })) factors.push(aRec);
    }
  }

  // 占优因子排在战绩之后
  if (h2hFactor) factors.push(h2hFactor);

  // 用有效排名计算
  const diff = Math.abs(ehr - ear);
  const higher = ehr < ear ? homeName : awayName;

  // 5. 进攻力系数（基础排名分档，影响比分）
  function atkTier(rank) {
    if (rank <= 10) return 3;
    if (rank <= 30) return 2;
    if (rank <= 50) return 1;
    return 0;
  }
  const hAtk = atkTier(hr);
  const aAtk = atkTier(ar);

  let pick, prediction;
  if (diff >= 60) {
    const hg = 3 + Math.floor((hAtk - aAtk + 2) / 2);
    const lg = Math.max(0, aAtk - 1);
    prediction = higher === homeName ? (hg + ' : ' + lg) : (lg + ' : ' + hg);
    pick = higher + ' 胜';
  } else if (diff >= 40) {
    const hg = 2 + Math.floor((hAtk - aAtk + 1) / 2);
    const lg = Math.max(0, aAtk - 1);
    prediction = higher === homeName ? (hg + ' : ' + lg) : (lg + ' : ' + hg);
    pick = higher + ' 胜';
  } else if (diff >= 30) {
    prediction = higher === homeName ? '2 : 1' : '1 : 2';
    pick = higher + ' 胜';
  } else if (diff >= 10) {
    prediction = higher === homeName ? '1 : 0' : '0 : 1';
    pick = higher + ' 胜';
  } else if (diff >= 3) {
    prediction = higher === homeName ? '1 : 0' : '0 : 1';
    pick = higher + ' 胜';
  } else {
    prediction = '1 : 1';
    pick = '平局';
  }

  // 过滤与预测矛盾的因子（如交锋占优方 ≠ 预测胜方）
  /*
   * 预测已基于有效排名差值锁定胜方，此时若 reasons 中展示"对手占优"
   * 会造成逻辑矛盾。因此过滤掉所有含"占优"且属于对手方的因子，
   * 并在过滤后从胜方近期战绩中补回一条因子，避免理由过短。
   */
  if (pick !== '平局') {
    var winner = pick.split(' ')[0];
    factors = factors.filter(function(f) {
      if (f.indexOf('占优') >= 0 && f.indexOf(winner) < 0) return false;
      // 过滤预测胜方的负面近期战绩（如"法国1-2遭科特迪瓦逆转" / "澳大利亚首轮0 : 2负土耳其"）
      if (f.indexOf(winner) === 0) {
        var rest = f.substring(winner.length);
        // 去掉动态近期战绩的轮次前缀（"首轮" / "第2轮" 等），露出比分
        var clean = rest.replace(/^(首轮|第\d+轮)/, '');
        var sm = clean.match(/^(\d+)\s*[-:]\s*(\d+)/);
        if (sm && parseInt(sm[1]) < parseInt(sm[2])) return false; // 比分显示己方落败
        if (/遭|惨败|不敌|失利/.test(rest)) return false; // 负面关键词
      }
      return true;
    });
    // 占优因子被过滤时（历史交锋有利方≠预测胜方），补回胜方战绩
    if (h2hFactor && h2hFactor.indexOf(winner) < 0 && factors.length < 2) {
      var winRec = winner === homeName ? hRec : aRec;
      if (winRec && !factors.some(function(f) { return f.indexOf(winner) === 0; })) {
        // 不补回负面战绩（与上方负面过滤规则一致）
        var wRest = winRec.substring(winner.length);
        var wClean = wRest.replace(/^(首轮|第\d+轮)/, '');
        var wSm = wClean.match(/^(\d+)\s*[-:]\s*(\d+)/);
        if (!(wSm && parseInt(wSm[1]) < parseInt(wSm[2])) && !/遭|惨败|不敌|失利/.test(wRest)) {
          factors.unshift(winRec);
        }
      }
    }
  }

  // 排名前缀
  var rankStr = '世界第' + hr + ' vs 第' + ar;

  // 精简理由
  let reason, verdict;
  if (diff >= 60) verdict = '稳操胜券';
  else if (diff >= 40) verdict = '明显占优';
  else if (diff >= 30) verdict = '优势不小';
  else if (diff >= 10) verdict = '胜算较高';
  else if (diff >= 3) verdict = '略胜一筹';
  else verdict = '势均力敌';

  if (pick !== '平局') verdict = higher + verdict;

  /*
   * 理由展示策略：取前 2 条因子 + 排名信息。
   * 若 h2hFactor 存在但在尾部（排第 3+ 位），强制提升到第 2 位替换掉第 2 条因子，
   * 确保"交锋占优"这类强信号始终可见。
   * 若没有"占优"类因子，额外追加综合判断结语（十拿九稳/略占上风 等）。
   */
  if (factors.length > 0) {
    var shown = factors.slice(0, 2);
    if (h2hFactor && shown.indexOf(h2hFactor) === -1 && factors.indexOf(h2hFactor) !== -1) {
      shown = shown.slice(0, 1).concat([h2hFactor]);
    }
    reason = rankStr + '：' + shown.join('，');
    var hasDom = shown.some(function(f) { return f.indexOf('占优') >= 0; });
    if (!hasDom) {
      var softV;
      if (diff >= 70) softV = '十拿九稳';
      else if (diff > 50) softV = '胜算极高';
      else if (diff > 30) softV = '更胜一筹';
      else if (diff > 10) softV = '优势明显';
      else if (diff > 5) softV = '略占上风';
      else softV = '势均力敌';
      reason += '，综合判断，' + (pick !== '平局' ? higher + softV : '可能' + softV);
    }
  } else {
    reason = rankStr + '：' + verdict;
  }

  return { pick, prediction, reason };
}

// 预测缓存：待开赛时生成的 AI 预测，用于已完赛面板直接读取，避免赛后重新分析
let predictionStore = {};

// 动态近期战绩（从已完赛比赛提取，替换静态 RECENT）
let dynamicRecent = {};

// 小组积分榜（从 ESPN standings API 动态拉取）
let groupStandings = {};

/*
 * 为所有未开赛比赛填充 AI 预测结果。
 * 跳过已结束(isEnded)和进行中(liveScore)的场次（保持赛前锁定的预测不变，赛中不动态调整）。
 * 对每场未开赛调用 predictMatch，结果统一转为主队视角（"主队名 胜/负"），
 * 同时写入 predictionStore 缓存供后续复用。
 */
function populatePredictions() {
  for (const m of upcoming) {
    var p;
    if (m.isEnded) continue;  // 比赛结束，保持已生成的AI竞猜不变
    if (m.liveScore) continue;  // 比赛进行中，保持赛前预测不变
    p = predictMatch(m.homeName, m.awayName, settled, m.league);
    // 统一转为主队视角：显示主队名+胜负
    if (p.pick !== '平局') {
      var pWinner = p.pick.split(' ')[0];
      p.pick = pWinner === m.homeName ? (m.homeName + ' 胜') : (m.homeName + ' 负');
    }
    m.pick = p.pick;
    m.prediction = p.prediction;
    m.reason = p.reason;
    predictionStore[m.homeName + '|' + m.awayName] = p;
  }
}

    $wrap.scrollLeft = start + (end - start) * ease;

let livePollTimer = null;
let minuteRefreshTimer = null;

function getStatus(timeStr) {
  const ts = parseMatchTime(timeStr);
  return getStatusFromTs(ts);
}

function parseMatchTime(timeStr) {
  const [md, hm] = timeStr.split(' ');
  const m = parseInt(md.split('月')[0]);
  const d = parseInt(md.split('月')[1].split('日')[0]);
  const [h, min] = hm.split(':').map(Number);
  return new Date(2026, m - 1, d, h, min, 0).getTime();
}

/*
 * 推算比赛当前分钟数。
 * 优先使用 ESPN 接口返回的精确分钟数（_espnClockMin），基于 fetch 时间戳递推。
 * 若无 ESPN 数据，兜底按开球时间 + 自由流逝时间估算，中场休息（45~60分钟区间）返回 -1。
 */
function getMatchMinute(m) {
  if (m._espnClockMin != null && m._clockFetchedAt) {
    return m._espnClockMin + Math.floor((Date.now() - m._clockFetchedAt) / 60000);
  }
  // 兜底：按开球后的自由流逝时间推算，中场休息时段返回 -1
  const ts = parseMatchTime(m.time);
  const elapsed = Math.floor((Date.now() - ts) / 60000);
  if (elapsed < 0) return 0;
  if (elapsed <= 48) return elapsed;
  if (elapsed <= 63) return -1;
  return Math.min(105, elapsed - 15);
}

function getStatusFromTs(matchTs) {
  const now = Date.now();
  const diff = (now - matchTs) / 60000;
  if (diff < 0) return ['upcoming', '待开赛'];
  if (diff < 150) return ['live', '比赛中'];
  return ['ended', '已完赛'];
}

function formatDuration(seconds) {
  const m = Math.round(seconds / 60);
  return m + '分钟';
}

function minuteText(m) {
  const v = getMatchMinute(m);
  return v === -1 ? '中场休息' : v + '分钟';
}

function pickHtml(m) {
  if (!m.pick || m.pick === '平局') return '';
  var idx = m.pick.lastIndexOf(' ');
  if (idx === -1) return m.pick;
  var name = m.pick.substring(0, idx);
  var result = m.pick.substring(idx + 1);
  if (result === '胜') return name + ' <span style="color:#00b894;font-weight:600">胜</span>';
  if (result === '负') return name + ' <span style="color:#e17055;font-weight:600">负</span>';
  return m.pick;
}

    return `

        '<div style="text-align:center">' +

// 从 ESPN standings API 拉取小组积分榜
async function fetchStandings() {
  try {
    const url = 'https://site.web.api.espn.com/apis/v2/sports/soccer/fifa.world/standings?season=2026';
    let resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) {
      resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
    }
    if (!resp.ok) return null;
    const data = await resp.json();
    const groups = {};
    const children = data.children || [];
    children.forEach(function(child) {
      const groupName = (child.name || '').replace('GROUP ', '');
      const entries = child.standings?.entries || [];
      groups[groupName] = entries.map(function(e) {
        const stats = e.stats || [];
        return {
          team: cnName(e.team?.displayName || e.team?.shortDisplayName || ''),
          pts: (stats.find(function(s) { return s.name === 'points'; }) || {}).value || 0,
          gd: (stats.find(function(s) { return s.name === 'pointDifferential'; }) || {}).value || 0,
          gf: (stats.find(function(s) { return s.name === 'pointsFor'; }) || {}).value || 0,
          ga: (stats.find(function(s) { return s.name === 'pointsAgainst'; }) || {}).value || 0,
          gp: (stats.find(function(s) { return s.name === 'gamesPlayed'; }) || {}).value || 0,
          note: (e.note || {}).description || ''
        };
      });
    });
    return groups;
  } catch(e) { return null; }
}

/*
 * 从已完赛比赛构建动态近期战绩。
 * 每支球队以最新一场结果生成描述字符串，格式如"首轮2:1胜西班牙"。
 * 用于 predictMatch 的 recentFactor 优先替代静态 RECENT 数据，确保战绩反映最新赛况。
 * 返回 { 球队名: "战绩描述" }。
 */
function buildDynamicRecent(settledMatches) {
  const recent = {};
  const roundMap = {};  // 每队出场次数计数，用于标记轮次
  // 按时间升序排列：轮次标签正确（首轮→第N轮），且最后写入的为最新比赛
  const sorted = [...settledMatches].sort((a, b) => (a.matchTs || 0) - (b.matchTs || 0));
  sorted.forEach(function(m) {
    const parts = m.score.split(' : ');
    const hScore = parseInt(parts[0]), aScore = parseInt(parts[1]);
    const hR = hScore > aScore ? '胜' : (hScore === aScore ? '平' : '负');
    const aR = aScore > hScore ? '胜' : (aScore === hScore ? '平' : '负');
    roundMap[m.homeName] = (roundMap[m.homeName] || 0) + 1;
    roundMap[m.awayName] = (roundMap[m.awayName] || 0) + 1;
    var hRound = roundMap[m.homeName] === 1 ? '首轮' : '第' + roundMap[m.homeName] + '轮';
    var aRound = roundMap[m.awayName] === 1 ? '首轮' : '第' + roundMap[m.awayName] + '轮';
    recent[m.homeName] = hRound + m.score + hR + m.awayName;
    recent[m.awayName] = aRound + aScore + ' : ' + hScore + aR + m.homeName;
  });
  return recent;
}

/*
 * 数据刷新主流程。
 * 从 ESPN API 拉取最新赛果/赛程 → 提取已完赛(settled)和未开赛(upcoming) → 
 * 拉取小组积分榜(fetchStandings) → 构建动态近期战绩(buildDynamicRecent) →
 * 为已完赛补 AI 预测比分(predictMatch/predictionStore 缓存) →
 * 为进行中比赛补赛前预测(predictionStore 赛前锁定) →
 * 检测数据变更，变更时重新渲染并写 sessionStorage 缓存。
 *
 * 安全兜底：15 秒超时后强制恢复按钮，避免网络异常导致 UI 卡死。
 */
async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  const orig = btn.textContent;
  btn.innerHTML = '<span class="spin-icon">⏳</span> 刷新中...';
  btn.disabled = true;

  // 安全兜底：15秒后强制恢复按钮，避免永远卡在"刷新中..."
  var safetyTimer = setTimeout(function() {
    clearTimeout(window._emergencyTimer);
    if (btn.disabled) {
      btn.disabled = false;
      btn.textContent = orig;
      if (!initialized) {
        settled = [...DEFAULT_SETTLED];
        settled.forEach(function(m) { m.duration = 5400; });
        disclaimerShown = true;
        try { renderPanels(); syncTrackHeight(); } catch(e) {}
        initialized = true;
      }
    }
  }, 15000);

  if (!initialized) {
    $upcomingPanel.innerHTML = '<div style="text-align:center;padding:60px 0;color:#888;font-size:1rem"><span style="display:inline-block;animation:spin 0.8s linear infinite">⏳</span> 刷新中...</div>';
    $settledPanel.innerHTML = '<div style="text-align:center;padding:60px 0;color:#888;font-size:1rem"><span style="display:inline-block;animation:spin 0.8s linear infinite">⏳</span> 刷新中...</div>';
  }

  try {
    const base = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=';
    const wcStart = new Date(2026, 5, 11);
    const wcEnd = new Date(2026, 6, 20);
    const ranges = [];
    for (var rd = new Date(wcStart); rd <= wcEnd; rd.setDate(rd.getDate() + 1)) {
      var y1 = rd.getFullYear() + String(rd.getMonth() + 1).padStart(2, '0') + String(rd.getDate()).padStart(2, '0');
      var nx = new Date(rd); nx.setDate(nx.getDate() + 1);
      var y2 = nx.getFullYear() + String(nx.getMonth() + 1).padStart(2, '0') + String(nx.getDate()).padStart(2, '0');
      ranges.push(y1 + '-' + y2);
    }

    // 按距离今天远近排序，首批拿到最近日期的比赛
    var todayTs = new Date().setHours(0,0,0,0);
    ranges.sort(function(a, b) {
      var da = Math.abs(new Date(a.substr(0,4)+'-'+a.substr(4,2)+'-'+a.substr(6,2)).getTime() - todayTs);
      var db = Math.abs(new Date(b.substr(0,4)+'-'+b.substr(4,2)+'-'+b.substr(6,2)).getTime() - todayTs);
      return da - db;
    });

    const seen = new Set();
    const newSettled = [];
    const newUpcoming = [];

    // 分批并发请求+逐批渲染（每批 6 个）
    const batchSize = 6;
    for (var bi = 0; bi < ranges.length; bi += batchSize) {
      const batch = ranges.slice(bi, bi + batchSize);
      const batchResults = await Promise.allSettled(batch.map(async (range) => {
        const url = base + range;
        try {
          let resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!resp.ok) {
            resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
          }
          if (!resp.ok) return [];
          const data = await resp.json();
          return data.events || [];
        } catch { return []; }
      }));

      // 处理本批事件并加入数组
      for (const r of batchResults) {
        if (r.status !== 'fulfilled') continue;
        r.value.forEach(ev => {
          const id = ev.id;
          if (seen.has(id)) return; seen.add(id);
          const comp = (ev.competitions || [])[0];
          if (!comp) return;
          const teams = comp.competitors || [];
          if (teams.length < 2) return;
          const hNameEn = teams[0].team?.displayName || teams[0].team?.shortDisplayName || '?';
          const aNameEn = teams[1].team?.displayName || teams[1].team?.shortDisplayName || '?';
          const hName = cnName(hNameEn);
          const aName = cnName(aNameEn);
          const hFlag = FLAG_MAP[hName] || '';
          const aFlag = FLAG_MAP[aName] || '';
          const leagueNote = comp.altGameNote || '';
          const lgMatch = leagueNote.match(/Group (\w+)/);
          let league = lgMatch ? lgMatch[1] + '组' : '';
          if (!league) {
            const enName = hNameEn + aNameEn;
            if (/Group [A-Z] (Winner|2nd)|Third Place Group/i.test(enName)) league = '1/16决赛';
            else if (/Round of 32/i.test(enName)) league = '1/8决赛';
            else if (/Round of 16/i.test(enName)) league = '1/4决赛';
            else if (/Quarterfinal/i.test(enName)) league = '半决赛';
            else if (/Semifinal.*Loser/i.test(enName)) league = '季军赛';
            else if (/Semifinal/i.test(enName)) league = '决赛';
          }

          const status = comp.status || {};
          const isCompleted = status.type?.completed === true;
          const isLive = status.type?.state === 'in';
          const hScore = teams[0].score || '0';
          const aScore = teams[1].score || '0';
          const scoreStr = isCompleted || isLive ? `${hScore} : ${aScore}` : '';

          let time = '';
          let matchTs = 0;
          if (ev.date) {
            const d = new Date(ev.date);
            time = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            matchTs = new Date(2026, d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), 0).getTime();
          }

          if (isCompleted) {
            var clock = status.displayClock || '';
            var durationSec = 5400;
            var cm = clock.match(/^(\d+)'(\+(\d+)')?/);
            if (cm) durationSec = parseInt(cm[1]) * 60 + (parseInt(cm[3]) || 0) * 60;
            newSettled.push({
              home: hFlag, homeName: hName, away: aFlag, awayName: aName,
              time, league, score: scoreStr, matchTs,
              duration: durationSec
            });
          } else if (time) {
            var liveEntry = {
              home: hFlag, homeName: hName, away: aFlag, awayName: aName,
              time, league, liveScore: isLive ? scoreStr : null
            };
            if (isLive) {
              var lclock = status.displayClock || '';
              var m2 = lclock.match(/^(\d+)'(\+(\d+)')?/);
              if (m2) {
                liveEntry._espnClockMin = parseInt(m2[1]) + (parseInt(m2[3]) || 0);
                liveEntry._clockFetchedAt = Date.now();
              }
            }
            newUpcoming.push(liveEntry);
          }
        });
      }

      // 保留已有的 AI 预测，避免刷新期间闪回"待分析"/"—"
      if (settled.length > 0) {
        var oldSMap = {};
        settled.forEach(function(s) { oldSMap[s.homeName + '|' + s.awayName] = s; });
        newSettled.forEach(function(m) {
          var kk = m.homeName + '|' + m.awayName;
          var old = oldSMap[kk];
          if (old && old.aiScore !== undefined) m.aiScore = old.aiScore;
        });
      }
      if (upcoming.length > 0) {
        var oldUMap = {};
        upcoming.forEach(function(u) { oldUMap[u.homeName + '|' + u.awayName] = u; });
        newUpcoming.forEach(function(m) {
          var kk = m.homeName + '|' + m.awayName;
          var old = oldUMap[kk];
          if (old) {
            if (!m.isLive) { m.pick = old.pick; m.prediction = old.prediction; m.reason = old.reason; }
          }
        });
      }
      // 本批处理完即渲染（首次加载时尽快出内容）
      newSettled.sort((a, b) => b.matchTs - a.matchTs);
      settled = newSettled;
      upcoming = newUpcoming.length > 0 ? newUpcoming : upcoming;
      if (bi === 0) { disclaimerShown = true; initialized = true; }
      renderPanels();
      syncTrackHeight();
    }

    // 最终排序
    newSettled.sort((a, b) => b.matchTs - a.matchTs);

    // 拉取小组积分榜 + 构建动态近期战绩
    var standingsPromise = fetchStandings();
    var oldSettled = settled;
    if (newSettled.length > 0) {
      settled = newSettled;
      dynamicRecent = buildDynamicRecent(newSettled);
    }

    // 为 ESPN 数据补充 AI 竞猜比分和组名
    var aiMap = {}, lgMap = {}, teamGroup = {};
    DEFAULT_SETTLED.forEach(function(d) { aiMap[d.homeName + '|' + d.awayName] = d.aiScore; lgMap[d.homeName + '|' + d.awayName] = d.league; teamGroup[d.homeName] = d.league; teamGroup[d.awayName] = d.league; });
    DEFAULT_UPCOMING.forEach(function(d) { lgMap[d.homeName + '|' + d.awayName] = d.league; teamGroup[d.homeName] = d.league; teamGroup[d.awayName] = d.league; });
    newSettled.forEach(function(m) {
      var key = m.homeName + '|' + m.awayName;
      m.aiScore = aiMap[key];
      m.league = lgMap[key] || teamGroup[m.homeName] || teamGroup[m.awayName] || m.league;
      if (!m.aiScore) {
        if (predictionStore[key]) {
          m.aiScore = predictionStore[key].prediction;
        } else {
          // 排除本场自身，避免数据泄露（赛后拿真实比分去"预测"自己）
          var p = predictMatch(m.homeName, m.awayName, newSettled.filter(function(s) { return s !== m; }), m.league);
          predictionStore[key] = p;
          m.aiScore = p.prediction;
        }
      }
    });

    // 始终更新未来比赛数据
    var updatedUpcoming = false;
    if (newUpcoming.length > 0) {
      var defLg = {};
      DEFAULT_UPCOMING.forEach(function(d) { defLg[d.homeName + '|' + d.awayName] = d.league; });
      newUpcoming.forEach(function(m) {
        var key = m.homeName + '|' + m.awayName;
        m.league = defLg[key] || teamGroup[m.homeName] || teamGroup[m.awayName] || m.league;
      });
    }
    upcoming = newUpcoming.length > 0 ? newUpcoming : upcoming;
    // 比赛进行中的取赛前竞猜缓存；缓存缺失时补算一次（新增赛程首次出现即为 live 的场景）
    if (newUpcoming.length > 0) {
      for (var ui = 0; ui < upcoming.length; ui++) {
        var um = upcoming[ui];
        if (um.liveScore) {
          var pk = um.homeName + '|' + um.awayName;
          var cp = predictionStore[pk];
          if (!cp) {
            cp = predictMatch(um.homeName, um.awayName, settled, um.league);
            // 转为主队视角，与 populatePredictions 保持一致
            if (cp.pick !== '平局') {
              var pWinner = cp.pick.split(' ')[0];
              cp.pick = pWinner === um.homeName ? (um.homeName + ' 胜') : (um.homeName + ' 负');
            }
            predictionStore[pk] = cp;
          }
          um.pick = cp.pick;
          um.prediction = cp.prediction;
          um.reason = cp.reason;
        }
      }
    }
    if (upcoming.length > 0) {
      populatePredictions();
      updatedUpcoming = true;
    }

    var changed = false;
    if (newSettled.length > 0) {
      changed = !initialized;
      if (!changed) {
        changed = newSettled.length !== oldSettled.length;
        if (!changed) {
          for (var i = 0; i < newSettled.length; i++) {
            if (newSettled[i].homeName !== oldSettled[i].homeName || newSettled[i].score !== oldSettled[i].score) { changed = true; break; }
          }
        }
      }
      disclaimerShown = true;
      initialized = true;
    } else if (!initialized) {
      disclaimerShown = true;
      initialized = true;
      renderPanels();
      syncTrackHeight();
    }

    // 统一渲染入口：每次刷新都更新时间戳和面板
    var nd = new Date(); lastUpdate = (nd.getMonth()+1) + '月' + nd.getDate() + '日 ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
    $disc.innerHTML = '数据更新于 ' + lastUpdate + '<br>AI 分析基于球队排名/本届战绩/出线形势/历史交锋';
    renderPanels();
    syncTrackHeight();
    if (changed || updatedUpcoming) {
      sessionStorage.setItem('wc2026_cache_v3', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming, pStore: predictionStore, dRecent: dynamicRecent}));
    }

    // 积分榜后台加载，不阻塞页面渲染
    standingsPromise.then(function(st) {
      if (st && Object.keys(st).length > 0) {
        groupStandings = st;
        populatePredictions();
        renderPanels();
        syncTrackHeight();
        sessionStorage.setItem('wc2026_cache_v3', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming, pStore: predictionStore, standings: groupStandings, dRecent: dynamicRecent}));
      }
    });

    scheduleLivePoll();
    btn.textContent = '✅ 已刷新 · ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    setTimeout(() => { btn.textContent = orig; }, 2000);
  } catch (e) {
    console.warn('ESPN fetch failed, using local data:', e);
    var nd = new Date();
    lastUpdate = (nd.getMonth()+1) + '月' + nd.getDate() + '日 ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
    if (!initialized) {
      settled = [...DEFAULT_SETTLED];
      // 补充比赛时长（默认90分钟）
      settled.forEach(function(m) { m.duration = 5400; });
      disclaimerShown = true;
      renderPanels();
      syncTrackHeight();
      initialized = true;
      sessionStorage.setItem('wc2026_cache_v3', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming, pStore: predictionStore, standings: groupStandings, dRecent: dynamicRecent}));
    } else {
      $updateTime.textContent = lastUpdate + ' 更新';
      $disc.innerHTML = '数据更新于 ' + lastUpdate + '<br>AI 分析基于球队排名/本届战绩/出线形势/历史交锋';
    }
    scheduleLivePoll();
    btn.textContent = '⚠ 网络失败，已用本地数据';
    setTimeout(() => { btn.textContent = orig; }, 2500);
  }
  clearTimeout(safetyTimer);
  btn.disabled = false;
}

function scheduleLivePoll() {
  clearTimeout(livePollTimer);
  clearInterval(minuteRefreshTimer);
  // 只要有未结束的比赛就持续轮询，不只在 ESPN 确认 live 后才启动
  var hasUpcoming = upcoming.some(function(m) { return !m.isEnded; });
  if (hasUpcoming) {
    livePollTimer = setTimeout(pollLiveScores, 60000);
    minuteRefreshTimer = setInterval(function() { renderPanels(); syncTrackHeight(); }, 60000);
  }
}

async function pollLiveScores() {
  var today = new Date();
  var ymd1 = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
  var tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  var ymd2 = tomorrow.getFullYear() + String(tomorrow.getMonth() + 1).padStart(2, '0') + String(tomorrow.getDate()).padStart(2, '0');
  var range = ymd1 + '-' + ymd2;

  try {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=' + range;
    var resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) { resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)); }
    if (!resp.ok) return;
    var data = await resp.json();
    var events = data.events || [];

    var espnMap = {};
    events.forEach(function(ev) {
      var comp = (ev.competitions || [])[0];
      if (!comp) return;
      var status = comp.status || {};
      var isLive = status.type?.state === 'in';
      var isCompleted = status.type?.completed === true;
      if (!isLive && !isCompleted) return;
      var teams = comp.competitors || [];
      if (teams.length < 2) return;
      var hName = cnName(teams[0].team?.displayName || teams[0].team?.shortDisplayName || '?');
      var aName = cnName(teams[1].team?.displayName || teams[1].team?.shortDisplayName || '?');
      var key = hName + '|' + aName;
      var scoreStr = (teams[0].score || '0') + ' : ' + (teams[1].score || '0');
      var durationSec = 5400;
      var espnClockMin = 0;
      if (isCompleted) {
        var clock = status.displayClock || '';
        var cm = clock.match(/^(\d+)'(\+(\d+)')?/);
        if (cm) durationSec = parseInt(cm[1]) * 60 + (parseInt(cm[3]) || 0) * 60;
      }
      if (isLive) {
        var lclock = status.displayClock || '';
        var lcm = lclock.match(/^(\d+)'(\+(\d+)')?/);
        if (lcm) espnClockMin = parseInt(lcm[1]) + (parseInt(lcm[3]) || 0);
      }
      espnMap[key] = { live: isLive, completed: isCompleted, score: scoreStr, duration: durationSec, espnClockMin: espnClockMin };
    });

    var changed = false;

    for (var i = 0; i < upcoming.length; i++) {
      var m = upcoming[i];
      if (m.isEnded) continue;
      var key = m.homeName + '|' + m.awayName;
      var e = espnMap[key];
      if (!e) continue;

      if (e.completed) {
        // 比赛结束：冻结比分和AI竞猜，留在待开赛列表
        m.score = e.score;
        m.duration = e.duration;
        m.isEnded = true;
        // 赛后从 predictionStore 回填 AI 预测，避免显示"待分析"
        var cp2 = predictionStore[key];
        if (cp2 && cp2.pick) { m.pick = cp2.pick; m.prediction = cp2.prediction; m.reason = cp2.reason; }
        changed = true;
      } else if (e.live) {
        if (e.espnClockMin != null) { m._espnClockMin = e.espnClockMin; m._clockFetchedAt = Date.now(); changed = true; }
        if (m.liveScore !== e.score) {
          m.liveScore = e.score;
          changed = true;
        }
      }
    }

    if (changed) {
      var nd = new Date();
      lastUpdate = (nd.getMonth()+1) + '月' + nd.getDate() + '日 ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
      $disc.innerHTML = '数据更新于 ' + lastUpdate + '<br>AI 分析基于球队排名/本届战绩/出线形势/历史交锋';
    }
    // 始终刷新面板，让比赛分钟数跟随本地时间更新
    renderPanels();
    syncTrackHeight();
  } catch(e) {}

  scheduleLivePoll();
}

</script>
