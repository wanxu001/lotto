  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: #0a0e17;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 720px; padding: 0 12px; }
    .header-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
    }
    h1 { font-size: 1.5rem; color: #ffd700; letter-spacing: 2px; margin: 0; }
    .subtitle { display:flex; justify-content:space-between; align-items:baseline; color:#555; font-size:0.7rem; margin-bottom:8px; }

    .sticky-head {
      position: sticky; top: 0; z-index: 100; background: #0a0e17; padding: 12px 0;
    }

    .tab-bar {
      display: flex; position: relative; z-index: auto;
      background: rgba(255,255,255,0.04); border-radius: 10px; padding: 4px;
    }
    .tab-slider {
      position: absolute; top: 4px; height: calc(100% - 8px); border-radius: 8px;
      background: rgba(255,215,0,0.2); transition: left 0.3s ease, width 0.3s ease;
      z-index: 0; pointer-events: none;
    }
    .tab-btn {
      flex: 1; padding: 10px; text-align: center; border-radius: 8px;
      font-size: 0.85rem; font-weight: bold; cursor: pointer;
      color: #666; border: none; background: transparent;
      outline: none; -webkit-tap-highlight-color: transparent; user-select: none;
      position: relative; z-index: 1; transition: color 0.3s;
    }
    .tab-btn.active { color: #ffd700; }

    .swipe-wrap {
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      height: auto;
    }
    .swipe-wrap::-webkit-scrollbar { display: none; }
    .swipe-track {
      display: flex; width: 200%;
      align-items: flex-start; height: auto;
      transition: height 0.3s ease;
    }
    .swipe-panel { width: 50%; flex-shrink: 0; scroll-snap-align: start; }

    .match-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 14px; margin-bottom: 10px;
    }
    .match-card.settled { opacity: 0.8; }

    .match-header {
      display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    }
    .match-time { color: #666; font-size: 0.75rem; }
    .match-status {
      padding: 1px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: bold;
    }
    .match-status.upcoming { background: rgba(64,128,255,0.15); color: #4080ff; }
    .match-status.live { background: rgba(255,80,80,0.15); color: #ff5050; animation: pulse 1.5s ease-in-out infinite; }
    .match-status.ended { background: rgba(255,255,255,0.08); color: #666; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .match-league {
      background: rgba(255,215,0,0.15); color: #ffd700; padding: 2px 8px;
      border-radius: 4px; font-size: 0.7rem; margin-left: auto;
    }

    .match-teams {
      display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 10px;
    }
    .team { text-align: center; }
    .team-flag { font-size: 2rem; }
    .team-name { font-size: 0.9rem; font-weight: bold; margin-top: 2px; }
    .vs { color: #444; font-size: 0.85rem; font-weight: bold; }
    .score-display { font-size: 1.3rem; font-weight: bold; color: #ffd700; }

    .ai-pick {
      background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(255,215,0,0.04));
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 10px; padding: 10px 14px; margin-top: 8px;
    }
    .ai-label { color: #ffd700; font-size: 0.72rem; margin-bottom: 4px; }
    .ai-result { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .ai-reason { color: #aaa; font-size: 0.72rem; margin-top: 4px; line-height: 1.5; }

    .refresh-btn {
      background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3);
      color: #ffd700; padding: 5px 14px; border-radius: 20px; font-size: 0.72rem;
      cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .refresh-btn:hover { background: rgba(255,215,0,0.2); }
    .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .refresh-btn .spin-icon {
      display: inline-block; animation: spin 0.8s linear infinite;
    }

    .disclaimer {
      text-align: center; color: #444; font-size: 0.65rem; padding: 20px 0;
    }
  </style>
</head>

function predictMatch(homeName, awayName, settledMatches) {
  const hr = RANKINGS[homeName] || 99;
  const ar = RANKINGS[awayName] || 99;
  const diff = Math.abs(hr - ar);
  const higher = hr < ar ? homeName : awayName;

  // 近期状态：从已完赛数据中查找两队表现
  let formNote = '';
  if (settledMatches) {
    for (const m of settledMatches) {
      if (m.homeName === homeName || m.awayName === homeName) {
        const scored = m.homeName === homeName ? parseInt(m.score.split(':')[0]) : parseInt(m.score.split(':')[1]);
        const conceded = m.homeName === homeName ? parseInt(m.score.split(':')[1]) : parseInt(m.score.split(':')[0]);
        formNote += homeName + (scored > conceded ? '首轮取胜' : scored === conceded ? '首轮战平' : '首轮告负') + '；';
      }
      if (m.awayName === awayName || m.homeName === awayName) {
        const scored = m.awayName === awayName ? parseInt(m.score.split(':')[1]) : parseInt(m.score.split(':')[0]);
        const conceded = m.awayName === awayName ? parseInt(m.score.split(':')[0]) : parseInt(m.score.split(':')[1]);
        formNote += awayName + (scored > conceded ? '首轮取胜' : scored === conceded ? '首轮战平' : '首轮告负') + '；';
      }
    }
  }

  let pick, prediction;
  const rankStr = '世界第' + (hr <= 50 ? hr : '50+') + ' vs 第' + (ar <= 50 ? ar : '50+');

  if (diff >= 60) {
    const g = 3 + Math.floor(Math.random() * 2);
    prediction = higher === homeName ? g + ' : 0' : '0 : ' + g;
    pick = higher + ' 胜';
  } else if (diff >= 30) {
    const g = 2 + Math.floor(Math.random() * 2);
    const l = Math.random() > 0.5 ? 1 : 0;
    prediction = higher === homeName ? g + ' : ' + l : l + ' : ' + g;
    pick = higher + ' 胜';
  } else if (diff >= 10) {
    const g = 1 + Math.floor(Math.random() * 2);
    const l = Math.random() > 0.4 ? 1 : 0;
    prediction = higher === homeName ? g + ' : ' + l : l + ' : ' + g;
    pick = higher + ' 胜';
  } else if (diff >= 3) {
    if (Math.random() > 0.3) {
      prediction = higher === homeName ? '1 : 0' : '0 : 1';
      pick = higher + ' 胜';
    } else {
      prediction = '1 : 1'; pick = '平局';
    }
  } else {
    prediction = Math.random() > 0.5 ? '1 : 1' : '0 : 0';
    pick = '平局';
  }

  let reason = rankStr + '，排名差' + diff + '位。';
  if (diff >= 60) reason += '实力悬殊，' + higher + '大概率零封取胜。';
  else if (diff >= 30) reason += '差距明显，' + higher + '占据绝对优势。';
  else if (diff >= 10) reason += higher + '实力更胜一筹，有望小胜。';
  else if (diff >= 3) reason += '差距微弱，' + (pick.includes('胜') ? higher + '略占上风。' : '大概率握手言和。');
  else reason += '实力伯仲之间，难分高下。';

  // 历史交锋
  const h2h = H2H[homeName + '|' + awayName];
  if (h2h && !h2h.includes('首次')) reason += ' 交锋：' + h2h;

  // 近期战绩
  const recHome = RECENT[homeName], recAway = RECENT[awayName];
  if (recHome) reason += ' ' + recHome;
  if (recAway) reason += ' ' + recAway;

  // 首轮战绩
  if (formNote) reason += ' ' + formNote;

  return { pick, prediction, reason };
}

function setSlider(p) {
  $slider.style.left = (sliderLeft0 + p * (sliderLeft1 - sliderLeft0)) + 'px';

}

function syncTrackHeight() {
  const panel = currentTab === 0 ? $upcomingPanel : $settledPanel;
  $track.style.height = panel.scrollHeight + 'px';
  $wrap.style.height = panel.scrollHeight + 'px';
  if ($disc) $disc.style.display = currentTab === 0 ? '' : 'none';

function switchTab(idx) {
  currentTab = idx;
  clicking = true;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clicking = false; }, 400);

  $wrap.style.height = ''; $track.style.height = '';
  const start = $wrap.scrollLeft;
  const end = idx === 0 ? 0 : $wrap.offsetWidth;
  $wrap.style.scrollSnapType = 'none';
  const t0 = performance.now();
  requestAnimationFrame(function anim(now) {
    const t = Math.min(1, (now - t0) / 300);
    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    $wrap.scrollLeft = start + (end - start) * ease;
    if (t < 1) requestAnimationFrame(anim);
    else { $wrap.style.scrollSnapType = ''; syncTrackHeight(); }
  });

  setSlider(idx);
  $btn0.style.color = idx ? '#666' : '#ffd700';
  $btn1.style.color = idx ? '#ffd700' : '#666';
  $btn0.classList.toggle('active', !idx);
  $btn1.classList.toggle('active', !!idx);
}

function getStatus(timeStr) {
  const [md, hm] = timeStr.split(' ');
  const m = parseInt(md.split('月')[0]);
  const d = parseInt(md.split('月')[1].split('日')[0]);
  const [h, min] = hm.split(':').map(Number);
  const matchTime = new Date(2026, m - 1, d, h, min, 0);
  const now = new Date();
  const diff = (now - matchTime) / 60000; // 分钟差
  if (diff < 0) return ['upcoming', '待开赛'];
  if (diff < 150) return ['live', '比赛中'];   // 约2.5小时窗口
  return ['ended', '已完赛'];
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  const orig = btn.textContent;
  btn.innerHTML = '<span class="spin-icon">⏳</span> 刷新中...';
  btn.disabled = true;

  if (!initialized) {
    $upcomingPanel.innerHTML = '<div style="text-align:center;padding:60px 0;color:#888;font-size:1rem"><span style="display:inline-block;animation:spin 0.8s linear infinite">⏳</span> 刷新中...</div>';
    $settledPanel.innerHTML = '<div style="text-align:center;padding:60px 0;color:#888;font-size:1rem"><span style="display:inline-block;animation:spin 0.8s linear infinite">⏳</span> 刷新中...</div>';
  }

  try {
    const base = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=';
    const ranges = ['20260611-20260612','20260612-20260613','20260613-20260614','20260614-20260615','20260615-20260616','20260616-20260617','20260617-20260618','20260618-20260619'];

    const allEvents = [];
    const seen = new Set();

    // 并行请求所有日期范围
    const results = await Promise.allSettled(ranges.map(async (range) => {
      const url = base + range;
      try {
        let resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!resp.ok) {
          resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
        }
        if (!resp.ok) return [];
        const data = await resp.json();
        return data.events || [];
      } catch { return []; }
    }));

    for (const r of results) {
      if (r.status !== 'fulfilled') continue;
      r.value.forEach(ev => {
        const id = ev.id;
        if (!seen.has(id)) { seen.add(id); allEvents.push(ev); }
      });
    }

    const newSettled = [];
    const newUpcoming = [];

    allEvents.forEach(ev => {
      const comp = (ev.competitions || [])[0];
      if (!comp) return;
      const teams = comp.competitors || [];
      if (teams.length < 2) return;
      const hNameEn = teams[0].team?.displayName || teams[0].team?.shortDisplayName || '?';
      const aNameEn = teams[1].team?.displayName || teams[1].team?.shortDisplayName || '?';
      const hName = cnName(hNameEn);
      const aName = cnName(aNameEn);
      const hFlag = FLAG_MAP[hName] || '';
      const aFlag = FLAG_MAP[aName] || '';

      const status = comp.status || {};
      const isCompleted = status.type?.completed === true;
      const isLive = status.type?.state === 'in';
      const hScore = teams[0].score || '0';
      const aScore = teams[1].score || '0';
      const scoreStr = isCompleted || isLive ? `${hScore} : ${aScore}` : '';

      let time = '';
      if (ev.date) {
        const d = new Date(ev.date);
        time = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }

      if (isCompleted) {
        newSettled.push({
          home: hFlag, homeName: hName, away: aFlag, awayName: aName,
          time, league: '', score: scoreStr
        });
      } else if (!isLive && time) {
        newUpcoming.push({
          home: hFlag, homeName: hName, away: aFlag, awayName: aName,
          time, league: ''
        });
      }
    });

    // 倒序排列（最新比赛在前）
    newSettled.sort((a, b) => {
      const parse = t => {
        const [md, hm] = t.split(' ');
        const m = parseInt(md.split('月')[0]);
        const d = parseInt(md.split('月')[1].split('日')[0]);
        const [h, min] = hm.split(':').map(Number);
        return new Date(2026, m - 1, d, h, min, 0).getTime();
      };
      return parse(b.time) - parse(a.time);
    });

    // 为 ESPN 数据补充 AI 竞猜比分和组名
    var aiMap = {}, lgMap = {};
    DEFAULT_SETTLED.forEach(function(d) { aiMap[d.homeName + '|' + d.awayName] = d.aiScore; lgMap[d.homeName + '|' + d.awayName] = d.league; });
    newSettled.forEach(function(m) {
      var key = m.homeName + '|' + m.awayName;
      m.aiScore = aiMap[key];
      m.league = lgMap[key] || m.league;
    });

    // 每天对一次赛程，更新未来比赛
    var today = (new Date()).toDateString();
    var lastScheduleCheck = sessionStorage.getItem('wc2026_schedule_check');
    var updatedUpcoming = false;
    if (lastScheduleCheck !== today && newUpcoming.length > 0) {
      var defLg = {};
      DEFAULT_UPCOMING.forEach(function(d) { defLg[d.homeName + '|' + d.awayName] = d.league; });
      newUpcoming.forEach(function(m) {
        var key = m.homeName + '|' + m.awayName;
        m.league = defLg[key] || '小组赛';
      });
      upcoming = newUpcoming;
      populatePredictions();
      sessionStorage.setItem('wc2026_schedule_check', today);
      updatedUpcoming = true;
    }

    if (newSettled.length > 0) {
      var changed = !initialized;
      if (!changed) {
        changed = newSettled.length !== settled.length;
        if (!changed) {
          for (var i = 0; i < newSettled.length; i++) {
            if (newSettled[i].homeName !== settled[i].homeName || newSettled[i].score !== settled[i].score) { changed = true; break; }
          }
        }
      }
      if (changed) {
        settled = newSettled; var nd = new Date(); lastUpdate = (nd.getMonth()+1) + '月' + nd.getDate() + '日 ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
        renderPanels();
        syncTrackHeight();
        sessionStorage.setItem('wc2026_cache_v2', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming}));
      } else if (updatedUpcoming) {
        renderPanels();
        syncTrackHeight();
        sessionStorage.setItem('wc2026_cache_v2', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming}));
      }
      disclaimerShown = true;
      $disc.innerHTML = '数据更新于 ' + lastUpdate + '<br>AI 分析基于球队排名/近期状态/历史交锋';
      initialized = true;
    } else if (!initialized) {
      disclaimerShown = true;
      renderPanels();
      syncTrackHeight();
      initialized = true;
      sessionStorage.setItem('wc2026_cache_v2', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming}));
    }
    btn.textContent = '✅ 已刷新 · ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    setTimeout(() => { btn.textContent = orig; }, 2000);
  } catch (e) {
    console.warn('ESPN fetch failed, using local data:', e);
    if (!initialized) {
      settled = [...DEFAULT_SETTLED];
      disclaimerShown = true;
      renderPanels();
      syncTrackHeight();
      initialized = true;
      sessionStorage.setItem('wc2026_cache_v2', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming}));
    }
    btn.textContent = '⚠ 网络失败，已用本地数据';
    setTimeout(() => { btn.textContent = orig; }, 2500);
  }
  btn.disabled = false;
}

</script>
</body>
