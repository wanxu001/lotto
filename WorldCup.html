    .tab-btn.active { color: #ffd700; }

    .swipe-wrap {
      overflow-x: auto; overflow-y: hidden;

      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      height: auto;
    }
    .swipe-wrap::-webkit-scrollbar { display: none; }
    .swipe-track {
      display: flex; width: 200%;
      align-items: flex-start; height: auto;
      transition: height 0.3s ease;
    }
    .swipe-panel { width: 50%; flex-shrink: 0; scroll-snap-align: start; }

      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 14px; margin-bottom: 10px;

    .match-time { color: #fff; font-size: 0.75rem; }

    }
    .match-status.upcoming { background: rgba(64,128,255,0.15); color: #4080ff; }
    .match-status.live { background: #e53935; color: #fff; }
    .match-status.ended { background: rgba(255,255,255,0.08); color: #666; }
    .live-hourglass { display: inline-block; animation: spin 1.5s linear infinite; }
    @keyframes spin { 100%{transform:rotate(360deg)} }
    .match-league {
      background: rgba(255,215,0,0.15); color: #ffd700; padding: 2px 4px;
      border-radius: 4px; font-size: 0.7rem; margin-left: auto;

    .team-flag { font-size: 2rem; }
    .flag-badge { display: inline-flex; align-items: center; justify-content: center; width: 2.4rem; height: 1.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; color: #fff; line-height: 1; }
    .flag-eng { background: #CE1124; }
    .flag-sco { background: #005EB8; }
    .flag-wal { background: #00AD36; }
    .team-flag .flag-badge { vertical-align: middle; }
    .team-name { font-size: 0.9rem; font-weight: bold; margin-top: 2px; }
    .vs { color: #444; font-size: 0.85rem; font-weight: bold; }
    .score-display { font-size: 1.3rem; font-weight: bold; color: #ffd700; }

    .ai-pick {
      background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(255,215,0,0.04));
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 10px; padding: 10px 14px; margin-top: 8px;
    }
    .ai-label { color: #ffd700; font-size: 0.72rem; margin-bottom: 4px; }
    .ai-result { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .ai-reason { color: #aaa; font-size: 0.72rem; margin-top: 4px; line-height: 1.5; }

    .refresh-btn {
      background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3);
      color: #ffd700; padding: 5px 14px; border-radius: 20px; font-size: 0.72rem;

      -webkit-tap-highlight-color: transparent; outline: none;

    .refresh-btn:hover { background: rgba(255,215,0,0.2); }
    .refresh-btn:active { background: rgba(255,215,0,0.1); transform: none; }
    .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    }

      display: inline-block; animation: spin 0.8s linear infinite;
    }

    .disclaimer {
      text-align: center; color: #444; font-size: 0.65rem; padding: 20px 0;
    }
  </style>

// FIFA 世界排名 (2026年6月)
const RANKINGS = {
  '阿根廷':1,'西班牙':2,'法国':3,'英格兰':4,'葡萄牙':5,'巴西':6,'摩洛哥':7,'荷兰':8,

function predictMatch(homeName, awayName, settledMatches, league) {
  const hr = RANKINGS[homeName] || 99;
  const ar = RANKINGS[awayName] || 99;

  // 有效排名 = 基础排名 + 修正（负数=增强）
  let ehr = hr, ear = ar;
  let factors = [];

  // 1. 本届多轮战绩修正（每队汇总为一条描述）
  if (settledMatches) {
    let homeRes = [], awayRes = [];
    for (const m of settledMatches) {
      if (m.homeName === homeName) {
        const [hs, as] = m.score.split(':').map(Number);
        homeRes.push(hs > as ? 'W' : (hs === as ? 'D' : 'L'));
        if (hs > as) ehr -= 8; else if (hs === as) ehr -= 2; else ehr += 5;
      }
      if (m.awayName === homeName) {
        const [hs, as] = m.score.split(':').map(Number);
        homeRes.push(as > hs ? 'W' : (as === hs ? 'D' : 'L'));
        if (as > hs) ehr -= 8; else if (as === hs) ehr -= 2; else ehr += 5;
      }
      if (m.homeName === awayName) {
        const [hs, as] = m.score.split(':').map(Number);
        awayRes.push(hs > as ? 'W' : (hs === as ? 'D' : 'L'));
        if (hs > as) ear -= 8; else if (hs === as) ear -= 2; else ear += 5;
      }
      if (m.awayName === awayName) {
        const [hs, as] = m.score.split(':').map(Number);
        awayRes.push(as > hs ? 'W' : (as === hs ? 'D' : 'L'));
        if (as > hs) ear -= 8; else if (as === hs) ear -= 2; else ear += 5;
      }
    }

    // 汇总一队描述
    function teamLabel(results, name) {
      if (results.length === 0) return null;
      const last = results[results.length - 1];
      let n = 1;
      for (let i = results.length - 2; i >= 0; i--) {
        if (results[i] === last) n++; else break;
      }
      if (n >= 2) {
        if (last === 'W') return name + n + '连胜势头正盛';
        if (last === 'L') return name + n + '连败状态低迷';
      }
      const w = results.filter(function(r) { return r === 'W'; }).length;
      const d = results.filter(function(r) { return r === 'D'; }).length;
      const l = results.filter(function(r) { return r === 'L'; }).length;
      if (l === 0 && d === 0) return name + w + '场全胜气势如虹';
      if (w === 0 && d === 0) return name + l + '场全败急需反弹';
      let label = name;
      if (w > 0) label += w + '胜';
      if (d > 0) label += d + '平';
      if (l > 0) label += l + '负';
      return label;
    }

    function streakVal(results) {
      if (results.length < 2) return 0;
      const last = results[results.length - 1];
      let n = 1;
      for (let i = results.length - 2; i >= 0; i--) {
        if (results[i] === last) n++; else break;
      }
      if (n >= 2 && last === 'W') return -(n * 3);
      if (n >= 2 && last === 'L') return n * 3;
      return 0;
    }
    ehr += streakVal(homeRes);
    ear += streakVal(awayRes);

    const hLabel = teamLabel(homeRes, homeName);
    const aLabel = teamLabel(awayRes, awayName);
    if (hLabel) factors.push(hLabel);
    if (aLabel) factors.push(aLabel);
  }

  // 2. 历史交锋修正
  const h2h = H2H[homeName + '|' + awayName];
  if (h2h && !h2h.includes('首次')) {
    const homeWins = (h2h.match(new RegExp(homeName + '(\\d+)胜')) || [])[1];
    const awayWins = (h2h.match(new RegExp(awayName + '(\\d+)胜')) || [])[1];
    if (homeWins || awayWins) {
      const hw = parseInt(homeWins) || 0, aw = parseInt(awayWins) || 0;
      if (hw > aw) { ehr -= 5; ear += 3; factors.push('交锋' + homeName + '占优'); }
      else if (aw > hw) { ear -= 5; ehr += 3; factors.push('交锋' + awayName + '占优'); }
    } else if (h2h.includes(homeName + '全胜') || h2h.includes(homeName + '占优')) {
      ehr -= 5; ear += 3; factors.push('交锋' + homeName + '占优');
    } else if (h2h.includes(awayName + '全胜') || h2h.includes(awayName + '占优')) {
      ear -= 5; ehr += 3; factors.push('交锋' + awayName + '占优');
    }
  }

  // 3. 出线形势修正
  if (league && groupStandings) {
    const groupKey = league.replace('组', '');
    const group = groupStandings[groupKey];
    if (group && group.length >= 4) {
      const homeRow = group.find(function(r) { return r.team === homeName; });
      const awayRow = group.find(function(r) { return r.team === awayName; });
      if (homeRow && homeRow.gp >= 1 && homeRow.pts === 0) { ehr -= 8; factors.push(homeName + '急需3分'); }
      else if (homeRow && homeRow.gp >= 1 && homeRow.pts === 1) { ehr -= 4; factors.push(homeName + '需取胜'); }
      if (awayRow && awayRow.gp >= 1 && awayRow.pts === 0) { ear -= 8; factors.push(awayName + '急需3分'); }
      else if (awayRow && awayRow.gp >= 1 && awayRow.pts === 1) { ear -= 4; factors.push(awayName + '需取胜'); }
    }
  }

  // 4. 近期状态补充（无本届战绩时用静态 RECENT）
  if (factors.length < 2) {
    function recentFactor(name) {
      var r = RECENT[name];
      if (!r) return null;
      var brief = r.split('，')[0].replace(/（[^）]*）/g, '');
      // 去掉冗余前缀，精简为关键数字
      brief = brief.replace(/^近\d+场/, '').replace(/^各项赛事/, '').replace(/^热身赛/, '');
      // "六连胜+5场零封" → "六连胜"
      brief = brief.replace(/\+.*$/, '');
      if (!brief) return null;
      // 限制长度
      if (brief.length > 8) brief = brief.substring(0, 8);
      return name + brief;
    }
    var hRec = recentFactor(homeName);
    var aRec = recentFactor(awayName);
    if (hRec && !factors.some(function(f) { return f.indexOf(homeName) === 0; })) factors.push(hRec);
    if (aRec && !factors.some(function(f) { return f.indexOf(awayName) === 0; })) factors.push(aRec);
  }

  // 用有效排名计算
  const diff = Math.abs(ehr - ear);
  const higher = ehr < ear ? homeName : awayName;

  // 5. 进攻力系数（基础排名分档，影响比分）
  function atkTier(rank) {
    if (rank <= 10) return 3;
    if (rank <= 30) return 2;
    if (rank <= 50) return 1;
    return 0;
  }
  const hAtk = atkTier(hr);
  const aAtk = atkTier(ar);

  let pick, prediction;
  if (diff >= 60) {
    const hg = 3 + Math.floor((hAtk - aAtk + 2) / 2);
    const lg = Math.max(0, aAtk - 1);
    prediction = higher === homeName ? (hg + ' : ' + lg) : (lg + ' : ' + hg);
    pick = higher + ' 胜';
  } else if (diff >= 40) {
    const hg = 2 + Math.floor((hAtk - aAtk + 1) / 2);
    const lg = Math.max(0, aAtk - 1);
    prediction = higher === homeName ? (hg + ' : ' + lg) : (lg + ' : ' + hg);
    pick = higher + ' 胜';
  } else if (diff >= 30) {
    prediction = higher === homeName ? '2 : 1' : '1 : 2';
    pick = higher + ' 胜';
  } else if (diff >= 10) {
    prediction = higher === homeName ? '1 : 0' : '0 : 1';
    pick = higher + ' 胜';
  } else if (diff >= 3) {
    prediction = higher === homeName ? '1 : 0' : '0 : 1';
    pick = higher + ' 胜';
  } else {
    prediction = '1 : 1';
    pick = '平局';
  }

  // 过滤与预测矛盾的因子（如交锋占优方 ≠ 预测胜方）
  if (pick !== '平局') {
    var winner = pick.split(' ')[0];
    factors = factors.filter(function(f) {
      if (f.indexOf('交锋') === 0 && f.indexOf('占优') >= 0 && f.indexOf(winner) < 0) return false;
      return true;
    });
  }

  // 精简理由
  let reason;
  function rankStr(r) { return r <= 50 ? r : (r === 99 ? '百名外' : r); }
  const rankLabel = '世界第' + rankStr(hr) + ' vs 第' + rankStr(ar);
  if (factors.length > 0) {
    reason = rankLabel + '，' + factors.slice(0, 2).join('，');
    if (diff >= 60) reason += '，稳操胜券';
    else if (diff >= 40) reason += '，明显占优';
    else if (diff >= 30) reason += '，优势不小';
    else if (diff >= 10) reason += '，胜算较高';
    else if (diff >= 3) reason += '，略胜一筹';
    else reason += '，势均力敌';
  } else {
    reason = rankLabel;
    if (diff >= 60) reason += '，稳操胜券';
    else if (diff >= 40) reason += '，明显占优';
    else if (diff >= 30) reason += '，优势不小';
    else if (diff >= 10) reason += '，胜算较高';
    else if (diff >= 3) reason += '，略胜一筹';
    else reason += '，势均力敌';
  }

  return { pick, prediction, reason };
}

  const parts = m.liveScore.split(' : ');
  const hScore = parseInt(parts[0]), aScore = parseInt(parts[1]);
  const goalDiff = hScore - aScore;

  const elapsed = Math.max(1, getMatchMinute(m));
  const remaining = Math.max(0, 90 - elapsed);

  const hr = RANKINGS[m.homeName] || 99;

  const leaderName = goalDiff > 0 ? m.homeName : (goalDiff < 0 ? m.awayName : null);
  const strongerName = hr < ar ? m.homeName : (ar < hr ? m.awayName : null);

  var finalHome = hScore, finalAway = aScore, pick, reasonHead;

  // === 补时阶段独立策略 ===
  if (elapsed > 90) {

    if (Math.abs(goalDiff) >= 2) {
      pick = leaderName + ' 胜';
      reasonHead = '加时/补时' + extraElapsed + '分钟，领先' + Math.abs(goalDiff) + '球胜券在握';
    } else if (Math.abs(goalDiff) === 1) {

        pick = leaderName + ' 胜';
        reasonHead = '加时/补时' + extraElapsed + '分钟，' + leaderName + '死守一球优势';
      } else {

        finalAway += (goalDiff > 0 ? 1 : 0);

        reasonHead = '加时/补时' + extraElapsed + '分钟，落后方孤注一掷有望扳平';

    } else {

        pick = strongerName + ' 胜';

          finalHome += (strongerName === m.homeName ? 1 : 0);
          finalAway += (strongerName === m.awayName ? 1 : 0);
          pick = strongerName + ' 胜';
        } else {
          finalHome += 1;
          pick = m.homeName + ' 胜';
        }
      }
      reasonHead = '加时/补时' + extraElapsed + '分钟，双方殊死一搏';
    }
    return { pick: pick, prediction: finalHome + ' : ' + finalAway, reason: '当前' + m.liveScore + '，' + reasonHead + '。' };
  }

  // === 常规时间：渐进阈值策略 ===
  if (Math.abs(goalDiff) >= 2) {

  } else if (Math.abs(goalDiff) === 1) {
    // 领先1球：remaining/30 衰减 + 排名差修正
    var scoreWeight = remaining / 30 + (leaderName === strongerName && rankGap >= 20 ? 0.3 : 0);
    var willExpand = remaining >= 25 || (remaining > 8 && scoreWeight > 0.5);
    if (willExpand) {
      finalHome += (goalDiff > 0 ? 1 : 0);
      finalAway += (goalDiff < 0 ? 1 : 0);
      pick = leaderName + ' 胜';
      reasonHead = '还剩' + remaining + '分钟，领先方或再下一城';

      reasonHead = '还剩' + remaining + '分钟，一球优势大概率守住';
    }
  } else {
    // 平局：三阶段衰减
    if (remaining <= 10) {
      if (strongerName && rankGap >= 20) {
        finalHome += (strongerName === m.homeName ? 1 : 0);
        finalAway += (strongerName === m.awayName ? 1 : 0);
        pick = strongerName + ' 胜';

      if (strongerName && rankGap >= 10) {

        pick = strongerName + ' 胜';

      finalHome += 1; finalAway += 1;
      pick = '平局';
      reasonHead = '还剩' + remaining + '分钟，双方或再各入一球';
    }
  }

  return { pick: pick, prediction: finalHome + ' : ' + finalAway, reason: '当前' + m.liveScore + '，' + reasonHead + '。' };
}

    if (p.pick !== '平局') {

      p.pick = pWinner === m.homeName ? (m.homeName + ' 胜') : (m.homeName + ' 负');
    }
    m.pick = p.pick;
    m.prediction = p.prediction;
    m.reason = p.reason;
    predictionStore[m.homeName + '|' + m.awayName] = p;
  }
}

let livePollTimer = null;

function getStatus(timeStr) {
  const ts = parseMatchTime(timeStr);
  return getStatusFromTs(ts);
}

function parseMatchTime(timeStr) {
  const [md, hm] = timeStr.split(' ');
  const m = parseInt(md.split('月')[0]);
  const d = parseInt(md.split('月')[1].split('日')[0]);
  const [h, min] = hm.split(':').map(Number);
  return new Date(2026, m - 1, d, h, min, 0).getTime();
}

function getMatchMinute(m) {
  if (m._espnClockMin != null) return m._espnClockMin;
  // 兜底：按预定时间推算
  const ts = parseMatchTime(m.time);
  return Math.max(0, Math.floor((Date.now() - ts) / 60000));
}

function getStatusFromTs(matchTs) {
  const now = Date.now();
  const diff = (now - matchTs) / 60000;
  if (diff < 0) return ['upcoming', '待开赛'];
  if (diff < 150) return ['live', '比赛中'];
  return ['ended', '已完赛'];
}

function formatDuration(seconds) {
  const m = Math.round(seconds / 60);
  return m + '分钟';
}

function aiLabelText(m) {
  if (m.pick) return '🤖 AI 竞猜';
  return 'AI 竞猜';
}

function formatElapsed(matchTs) {
  const elapsed = Math.max(0, Math.floor((Date.now() - matchTs) / 1000));
  return `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2,'0')}`;
}

function getLiveReason(originalReason, minute) {
  const remaining = Math.max(0, 90 - minute);
  let timeStr;
  if (minute > 90) {
    timeStr = '加时/补时' + (minute - 90) + '分钟';
  } else {
    timeStr = '还剩' + remaining + '分钟';
  }
  return originalReason.replace(/(?:还剩\d+分钟|加时\/补时\d+分钟)/, timeStr);
}

function pickHtml(m) {
  if (!m.pick || m.pick === '平局') return '';
  var idx = m.pick.lastIndexOf(' ');
  if (idx === -1) return m.pick;
  var name = m.pick.substring(0, idx);
  var result = m.pick.substring(idx + 1);
  if (result === '胜') return name + ' <span style="color:#00b894;font-weight:600">胜</span>';
  if (result === '负') return name + ' <span style="color:#e17055;font-weight:600">负</span>';
  return m.pick;
}

// 从 ESPN standings API 拉取小组积分榜
async function fetchStandings() {
  try {
    const url = 'https://site.web.api.espn.com/apis/v2/sports/soccer/fifa.world/standings?season=2026';
    let resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) {
      resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
    }
    if (!resp.ok) return null;
    const data = await resp.json();
    const groups = {};
    const children = data.children || [];
    children.forEach(function(child) {
      const groupName = (child.name || '').replace('GROUP ', '');
      const entries = child.standings?.entries || [];
      groups[groupName] = entries.map(function(e) {
        const stats = e.stats || [];
        return {
          team: cnName(e.team?.displayName || e.team?.shortDisplayName || ''),
          pts: (stats.find(function(s) { return s.name === 'points'; }) || {}).value || 0,
          gd: (stats.find(function(s) { return s.name === 'pointDifferential'; }) || {}).value || 0,
          gf: (stats.find(function(s) { return s.name === 'pointsFor'; }) || {}).value || 0,
          ga: (stats.find(function(s) { return s.name === 'pointsAgainst'; }) || {}).value || 0,
          gp: (stats.find(function(s) { return s.name === 'gamesPlayed'; }) || {}).value || 0,
          note: (e.note || {}).description || ''
        };
      });
    });
    return groups;
  } catch(e) { return null; }
}

// 从已完赛比赛构建动态近期战绩
function buildDynamicRecent(settledMatches) {
  const recent = {};
  settledMatches.forEach(function(m) {
    const parts = m.score.split(' : ');
    const hScore = parseInt(parts[0]), aScore = parseInt(parts[1]);
    const hDesc = hScore > aScore ? '胜' : (hScore === aScore ? '平' : '负');
    const aDesc = aScore > hScore ? '胜' : (aScore === hScore ? '平' : '负');
    recent[m.homeName] = '首轮' + m.score + (hScore > aScore ? '胜' : (hScore === aScore ? '平' : '负')) + m.awayName;
    recent[m.awayName] = '首轮' + aScore + ':' + hScore + (aScore > hScore ? '胜' : (aScore === hScore ? '平' : '负')) + m.homeName;
  });
  return recent;
}

// 基于小组积分榜生成出线形势分析
function getStandingNote(homeName, awayName, league) {
  if (!league || !groupStandings) return '';
  const groupKey = league.replace('组', '');
  const group = groupStandings[groupKey];
  if (!group || group.length < 4) return '';
  const homeRow = group.find(function(r) { return r.team === homeName; });
  const awayRow = group.find(function(r) { return r.team === awayName; });
  if (!homeRow || !awayRow) return '';

  var notes = [];
  // 已赛1场积0分 → 急需3分
  if (homeRow.gp >= 1 && homeRow.pts === 0) {
    notes.push(homeName + '积0分急需3分');
  } else if (homeRow.gp >= 1 && homeRow.pts === 1) {
    notes.push(homeName + '积1分需取胜掌握主动');
  }
  if (awayRow.gp >= 1 && awayRow.pts === 0) {
    notes.push(awayName + '积0分急需3分');
  } else if (awayRow.gp >= 1 && awayRow.pts === 1) {
    notes.push(awayName + '积1分需取胜掌握主动');
  }
  // 已晋级/已淘汰
  if (homeRow.note) notes.push(homeName + homeRow.note);
  if (awayRow.note) notes.push(awayName + awayRow.note);

  return notes.length > 0 ? '。出线形势：' + notes.join('；') : '';
}

  }

  try {

    const wcStart = new Date(2026, 5, 11);
    const wcEnd = new Date(2026, 5, 18);
    const ranges = [];
    for (var rd = new Date(wcStart); rd <= wcEnd; rd.setDate(rd.getDate() + 1)) {
      var y1 = rd.getFullYear() + String(rd.getMonth() + 1).padStart(2, '0') + String(rd.getDate()).padStart(2, '0');
      var nx = new Date(rd); nx.setDate(nx.getDate() + 1);
      var y2 = nx.getFullYear() + String(nx.getMonth() + 1).padStart(2, '0') + String(nx.getDate()).padStart(2, '0');
      ranges.push(y1 + '-' + y2);
    }

    const allEvents = [];
    const seen = new Set();

    // 并行请求所有日期范围
    const results = await Promise.allSettled(ranges.map(async (range) => {
      const url = base + range;
      try {
        let resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!resp.ok) {
          resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
        }
        if (!resp.ok) return [];

        return data.events || [];
      } catch { return []; }
    }));

    for (const r of results) {
      if (r.status !== 'fulfilled') continue;
      r.value.forEach(ev => {
        const id = ev.id;
        if (!seen.has(id)) { seen.add(id); allEvents.push(ev); }
      });
    }

    const newSettled = [];
    const newUpcoming = [];

    allEvents.forEach(ev => {
      const comp = (ev.competitions || [])[0];
      if (!comp) return;
      const teams = comp.competitors || [];
      if (teams.length < 2) return;
      const hNameEn = teams[0].team?.displayName || teams[0].team?.shortDisplayName || '?';
      const aNameEn = teams[1].team?.displayName || teams[1].team?.shortDisplayName || '?';
      const hName = cnName(hNameEn);
      const aName = cnName(aNameEn);
      const hFlag = FLAG_MAP[hName] || '';
      const aFlag = FLAG_MAP[aName] || '';

      const status = comp.status || {};
      const isCompleted = status.type?.completed === true;
      const isLive = status.type?.state === 'in';
      const hScore = teams[0].score || '0';
      const aScore = teams[1].score || '0';
      const scoreStr = isCompleted || isLive ? `${hScore} : ${aScore}` : '';

      let matchTs = 0;
      if (ev.date) {
        const d = new Date(ev.date);
        time = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

        newSettled.push({
          home: hFlag, homeName: hName, away: aFlag, awayName: aName,
          time, league: '', score: scoreStr, matchTs,
          duration: durationSec
        });
      } else if (time) {

          home: hFlag, homeName: hName, away: aFlag, awayName: aName,
          time, league: '', liveScore: isLive ? scoreStr : null
        });
      }
    });

    // 倒序排列（最新比赛在前），直接用已计算的时间戳
    newSettled.sort((a, b) => b.matchTs - a.matchTs);

    // 拉取小组积分榜 + 构建动态近期战绩
    var standingsPromise = fetchStandings();
    dynamicRecent = buildDynamicRecent(newSettled);

    // 为 ESPN 数据补充 AI 竞猜比分和组名
    var aiMap = {}, lgMap = {};
    DEFAULT_SETTLED.forEach(function(d) { aiMap[d.homeName + '|' + d.awayName] = d.aiScore; lgMap[d.homeName + '|' + d.awayName] = d.league; });
    DEFAULT_UPCOMING.forEach(function(d) { lgMap[d.homeName + '|' + d.awayName] = d.league; });
    newSettled.forEach(function(m) {
      var key = m.homeName + '|' + m.awayName;
      m.aiScore = aiMap[key];
      m.league = lgMap[key] || m.league;
      if (!m.aiScore) {
        if (predictionStore[key]) {
          m.aiScore = predictionStore[key].prediction;
        } else {
          var p = predictMatch(m.homeName, m.awayName, newSettled, m.league);
          predictionStore[key] = p;

        }

        renderPanels();

      }
      disclaimerShown = true;

      initialized = true;
    } else if (!initialized) {
      lastUpdate = (new Date().getMonth()+1) + '月' + new Date().getDate() + '日 ' + String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
      disclaimerShown = true;
      renderPanels();
      syncTrackHeight();
      initialized = true;
      sessionStorage.setItem('wc2026_cache_v2', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming, pStore: predictionStore, standings: groupStandings, dRecent: dynamicRecent}));
    }

    // 积分榜后台加载，不阻塞页面渲染
    standingsPromise.then(function(st) {
      if (st && Object.keys(st).length > 0) {
        groupStandings = st;
        populatePredictions();
        renderPanels();
        syncTrackHeight();
        sessionStorage.setItem('wc2026_cache_v2', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming, pStore: predictionStore, standings: groupStandings, dRecent: dynamicRecent}));
      }
    });

    scheduleLivePoll();
    btn.textContent = '✅ 已刷新 · ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    setTimeout(() => { btn.textContent = orig; }, 2000);
  } catch (e) {
    console.warn('ESPN fetch failed, using local data:', e);
    var nd = new Date();
    lastUpdate = (nd.getMonth()+1) + '月' + nd.getDate() + '日 ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
    if (!initialized) {
      settled = [...DEFAULT_SETTLED];
      // 补充比赛时长（默认90分钟）
      settled.forEach(function(m) { m.duration = 5400; });
      disclaimerShown = true;
      renderPanels();
      syncTrackHeight();
      initialized = true;
      sessionStorage.setItem('wc2026_cache_v2', JSON.stringify({settled: settled, lastUpdate: lastUpdate, upcoming: upcoming, standings: groupStandings, dRecent: dynamicRecent}));
    } else {
      $updateTime.textContent = lastUpdate + ' 更新';
      $disc.innerHTML = '数据更新于 ' + lastUpdate + '<br>AI 分析基于球队排名/本届战绩/出线形势/历史交锋';
    }
    scheduleLivePoll();
    btn.textContent = '⚠ 网络失败，已用本地数据';
    setTimeout(() => { btn.textContent = orig; }, 2500);
  }
  clearTimeout(safetyTimer);
  btn.disabled = false;
}

function scheduleLivePoll() {
  clearTimeout(livePollTimer);
  // 只要有未结束的比赛就持续轮询，不只在 ESPN 确认 live 后才启动
  var hasUpcoming = upcoming.some(function(m) { return !m.isEnded; });
  if (hasUpcoming) {
    livePollTimer = setTimeout(pollLiveScores, 60000);
  }
}

async function pollLiveScores() {
  var today = new Date();
  var ymd1 = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
  var tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  var ymd2 = tomorrow.getFullYear() + String(tomorrow.getMonth() + 1).padStart(2, '0') + String(tomorrow.getDate()).padStart(2, '0');
  var range = ymd1 + '-' + ymd2;

  try {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=' + range;
    var resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) { resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)); }
    if (!resp.ok) return;
    var data = await resp.json();
    var events = data.events || [];

    var espnMap = {};
    events.forEach(function(ev) {
      var comp = (ev.competitions || [])[0];
      if (!comp) return;
      var status = comp.status || {};
      var isLive = status.type?.state === 'in';
      var isCompleted = status.type?.completed === true;
      if (!isLive && !isCompleted) return;
      var teams = comp.competitors || [];
      if (teams.length < 2) return;
      var hName = cnName(teams[0].team?.displayName || teams[0].team?.shortDisplayName || '?');
      var aName = cnName(teams[1].team?.displayName || teams[1].team?.shortDisplayName || '?');
      var key = hName + '|' + aName;
      var scoreStr = (teams[0].score || '0') + ' : ' + (teams[1].score || '0');
      var durationSec = 5400;
      var espnClockMin = 0;
      if (isCompleted) {
        var clock = status.displayClock || '';
        var cm = clock.match(/^(\d+)'(\+(\d+)')?/);
        if (cm) durationSec = parseInt(cm[1]) * 60 + (parseInt(cm[3]) || 0) * 60;
      }
      if (isLive) {
        var lclock = status.displayClock || '';
        var lcm = lclock.match(/^(\d+)'(\+(\d+)')?/);
        if (lcm) espnClockMin = parseInt(lcm[1]) + (parseInt(lcm[3]) || 0);
      }
      espnMap[key] = { live: isLive, completed: isCompleted, score: scoreStr, duration: durationSec, espnClockMin: espnClockMin };
    });

    var changed = false;

    for (var i = 0; i < upcoming.length; i++) {
      var m = upcoming[i];
      if (!m.liveScore || m.isEnded) continue;
      var key = m.homeName + '|' + m.awayName;
      var e = espnMap[key];
      if (!e) continue;

      if (e.completed) {
        // 比赛结束：冻结比分和AI竞猜，留在待开赛列表
        m.score = e.score;
        m.duration = e.duration;
        m.isEnded = true;
        changed = true;
      } else if (e.live) {
        if (e.espnClockMin != null) { m._espnClockMin = e.espnClockMin; m._clockFetchedAt = Date.now(); changed = true; }
        if (m.liveScore !== e.score) {
          m.liveScore = e.score;
          changed = true;
        }
      }
    }

    if (changed) {
      var nd = new Date();
      lastUpdate = (nd.getMonth()+1) + '月' + nd.getDate() + '日 ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
      $disc.innerHTML = '数据更新于 ' + lastUpdate + '<br>AI 分析基于球队排名/本届战绩/出线形势/历史交锋';
    }
    // 始终刷新面板，让比赛分钟数跟随本地时间更新
    renderPanels();
    syncTrackHeight();
  } catch(e) {}

  scheduleLivePoll();
}

</script>
